packages:
  - '*'

minimumReleaseAge: 1440
# First-party packages publish from our own CI with provenance, so they skip the
# delay and the trust check.
minimumReleaseAgeExclude:
  - '@parallelworks/*'
trustPolicyExclude:
  - '@parallelworks/*'
blockExoticSubdeps: true
trustPolicy: no-downgrade

# pnpm publish checks the branch; releases come from canary.
publishBranch: canary

allowBuilds:
  '@parcel/watcher': false
  esbuild: false

overrides:
  # semver 6 predates provenance, so the trust policy refuses it; nothing in the
  # tree needs the old major.
  'semver@<7.0.0': '>=7.7.4'
  # monaco-editor pins dompurify exactly, so its fixes arrive only with a
  # monaco release; this lifts the pin past the advisories in between.
  'dompurify@<3.4.16': '^3.4.16'
  # The tailwind CLI pins a watcher that pulls in braces, which has an
  # unpatched denial-of-service advisory; 2.6 drops braces for picomatch.
  # Remove once a tailwind release depends on 2.6.
  '@parcel/watcher@<2.6.0': '^2.6.0'
  # The math renderer and its markdown plugins still ask for katex 0.16, which
  # has a prototype-pollution advisory fixed in 0.18.2. Remove once they
  # depend on 0.18. Exact, because 0.18.11 shipped breaking changes by mistake.
  'katex@<0.18.2': '0.18.10'
