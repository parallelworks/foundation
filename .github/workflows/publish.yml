name: Publish

# Merging a release-please PR that bumps a package's version publishes each
# package whose version is not yet on npm.
on:
  push:
    branches: [canary]
    paths: ['packages/*/package.json']
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/package.json
      # No dependency cache: a cache written by another workflow must not be
      # able to change what gets published.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        working-directory: packages
      - run: pnpm test
        working-directory: packages
      - name: Publish unreleased versions
        run: |
          set -euo pipefail
          for pkg in packages/*/package.json; do
            dir=$(dirname "$pkg")
            name=$(node -p "require('./$pkg').name")
            version=$(node -p "require('./$pkg').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published."
              continue
            fi
            echo "Publishing $name@$version"
            (cd "$dir" && pnpm publish --provenance --access public --no-git-checks)
          done
