name: Publish

# Merging a release-please PR that bumps a package's version publishes each
# package whose version is not yet on npm.
on:
  push:
    branches: [canary]
    paths: ['packages/*/package.json']
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
        working-directory: packages
      - run: pnpm test
        working-directory: packages
      - name: Publish unreleased versions
        run: |
          set -euo pipefail
          for pkg in packages/*/package.json; do
            dir=$(dirname "$pkg")
            name=$(node -p "require('./$pkg').name")
            version=$(node -p "require('./$pkg').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published."
              continue
            fi
            echo "Publishing $name@$version"
            (cd "$dir" && pnpm publish --provenance --access public --no-git-checks)
          done
