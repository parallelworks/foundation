name: CI

on:
  pull_request:
  push:
    branches: [canary]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    needs: actions
    # Missing outputs or a failed audit must never suppress the required checks.
    if: ${{ !cancelled() && (needs.actions.result != 'success' || needs.actions.outputs.go != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_DB: foundation_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Verify go.mod is tidy
        run: make tidy-check
      - name: Lint
        run: make lint-go
      - name: Check dependencies for known vulnerabilities
        run: make vulncheck
      - name: Test
        env:
          # go.mod also sets fips140=only; the environment makes the mode explicit
          # so that a future go.mod edit cannot silently drop it.
          GODEBUG: fips140=only
          FOUNDATION_TEST_DATABASE_URL: postgres://postgres@localhost:5432/foundation_test?sslmode=disable
        run: make test-go

  js:
    needs: actions
    if: ${{ !cancelled() && (needs.actions.result != 'success' || needs.actions.outputs.js != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: packages/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: make -C .. lint-js
      - name: Test
        run: make -C .. test-js
      - name: Build and verify packages
        # Installs the packed tarball into a fresh project, as a consumer would.
        run: make -C .. verify-build

  # Audits the workflows themselves: unpinned actions, template injection,
  # excessive permissions, cache poisoning in release jobs.
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    outputs:
      go: ${{ steps.changes.outputs.go }}
      js: ${{ steps.changes.outputs.js }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR checkout is a merge commit; its first parent is the tested base.
          fetch-depth: 2
      - name: Test change detection
        run: node --test .github/scripts/changes.test.mjs
      - name: Detect affected checks
        id: changes
        if: github.event_name == 'pull_request'
        run: node .github/scripts/changes.mjs >> "$GITHUB_OUTPUT"
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Fail the job on findings instead of uploading SARIF, which would
          # need security-events: write.
          advanced-security: false
