name: Storybook

# Publishes the ui workshop to GitHub Pages whenever ui changes on canary.
on:
  push:
    branches: [canary]
    paths:
      - 'packages/ui/**'
      - 'packages/package.json'
      - 'packages/pnpm-lock.yaml'
      - 'packages/pnpm-workspace.yaml'
      - 'packages/tsconfig.base.json'
      - '.github/workflows/storybook.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/package.json
      # No dependency cache: a cache written by another workflow must not be
      # able to change what gets deployed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @parallelworks/ui build-storybook
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/ui/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
